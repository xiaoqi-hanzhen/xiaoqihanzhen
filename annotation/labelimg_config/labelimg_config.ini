# LabelImg 配置文件
# 用于无人机异物检测的标注工具设置

[labelimg]
# 默认标注目录
annotation_dir = data/annotations

# 自动保存模式
auto_save = True

# 显示标注框标签
display_label = True

# 标注框线条粗细
line_thickness = 2

# 标注框颜色（RGB）
box_color = 255, 0, 0

# 标签字体大小
font_size = 10

# 预定义类别（异物检测）
predefined_classes = kite,plastic_film,color_cloth,balloon,bird_nest,foreign_object

# 快捷键设置
shortcut_key = 
    w = create_rectbox
    d = duplicate_rectbox
    ctrl+d = duplicate_rectbox
    ctrl+s = save
    ctrl+a = open_annotation
    ctrl+shift+a = open_next_annotation
    ctrl+o = open_file
    ctrl+u = open_dir
    ctrl+r = change_save_dir
    ctrl+e = create_rotation
    ctrl+h = create_line
    ctrl+q = quit
    ctrl+i = open_prev_annotation
    ctrl+l = open_next_annotation
    space = flag_widget
    del = delete_selected_shape
    ctrl++ = zoom_in
    ctrl+- = zoom_out
    ctrl+0 = zoom_original
    ctrl+= = zoom_in

# 图像显示设置
image_setting = 
    brightness = 1.0
    contrast = 1.0
    zoom_scale = 1.0
    fit_window = True
    fit_width = False

# 标注格式
annotation_format = PASCAL VOC XML

# 验证设置
validation = 
    validate_label = True
    difficult_label = difficult
    verify_label = True
    unique_label = True